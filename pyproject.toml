[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "mitene_download"
version = "7.1.0"
requires-python = ">=3.11"
dependencies = [
    "aiohttp[speedups]",
    "aiofiles",
    "tqdm",
    "aiosqlite",
    "beautifulsoup4",
    "piexif",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
readme = "README.md"
dynamic = ["description"]

[project.license]
file = "LICENSE"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Source = "https://github.com/xeloria/mitene-familyalbum-downloader"

[[project.authors]]
name = "Jérome Perrin"

[[project.authors]]
name = "Suasive93"

[project.scripts]
mitene_download = "mitene_download:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
